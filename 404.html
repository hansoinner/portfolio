<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2563eb">
    <meta name="color-scheme" content="light">
    <title>Page Not Found | Sondre G</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Arial,sans-serif' font-size='48' font-weight='700' fill='white'%3ESG%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #111827;
            background: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }
        main { width: min(680px, 100%); }
        .code {
            margin: 0;
            color: #2563eb;
            font-size: clamp(5rem, 18vw, 10rem);
            line-height: .9;
            font-weight: 800;
            letter-spacing: -.08em;
        }
        h1 {
            margin: 24px 0 12px;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            letter-spacing: -.03em;
        }
        p {
            max-width: 520px;
            margin: 0 auto 28px;
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        a {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, opacity .2s ease;
        }
        a:hover { transform: translateY(-2px); }
        a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
        .primary { color: #fff; background: #2563eb; }
        .secondary { color: #111827; background: #e2e8f0; }
        @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
    </style>
</head>
<body>
    <main aria-labelledby="page-title">
        <p class="code" aria-hidden="true">404</p>
        <h1 id="page-title">Page not found</h1>
        <p>The page you're looking for doesn't exist or may have been moved. Let's get you back to the portfolio.</p>
        <div class="actions">
            <a class="primary" href="./">Back to portfolio</a>
            <a class="secondary" href="./#projects">View projects</a>
        </div>
    </main>
</body>
</html>
